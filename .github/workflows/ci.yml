name: C++ CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard dependencies
        run: python -m pip install -r dashboard/requirements.txt
      - name: Test dashboard and C++ protocol adapter
        env:
          LOB_PROTOCOL_EXECUTABLE: ${{ github.workspace }}/build/lob_protocol
        run: python -m unittest discover -s dashboard -p 'test_*.py' -v
      - name: Smoke-test dashboard imports
        run: python -c "import dashboard.app"
